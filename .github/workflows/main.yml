name: Build JAR

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make Gradlew executable
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build --no-daemon

    - name: Locate JAR files
      run: |
        echo "=== JAR 文件列表 ==="
        find . -name "*.jar" -type f | grep -v "gradle" | head -10
        echo "=== jar/ 目录内容 ==="
        ls -la jar/ 2>/dev/null || echo "jar/ 目录不存在"

    - name: Upload jar artifacts
      uses: actions/upload-artifact@v4
      with:
        name: custom-spider-jar
        path: jar/
        retention-days: 30

    - name: Create release
      if: success()
      uses: softprops/action-gh-release@v1
      with:
        files: jar/*.jar
        tag_name: latest
        name: Latest Build
        body: 自动构建的 CatVodSpider jar 文件
        make_latest: true
