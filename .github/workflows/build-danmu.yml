name: Build Danmu JAR

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # ====== 验证源代码 ======
      - name: Verify source code
        run: |
          CONFIG_FILE="app/src/main/java/com/github/catvod/spider/DanmakuConfig.java"
          echo "=== 构建来源信息 ==="
          echo "Branch: $(git branch --show-current)"
          echo "Commit: $(git log -1 --oneline)"
          echo "Date: $(git log -1 --format='%ci')"
          echo ""
          echo "=== 文件路径: $CONFIG_FILE ==="
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ 文件不存在，搜索实际路径："
            find . -name "DanmakuConfig.java" -not -path "./.git/*"
            exit 1
          fi
          echo "=== 搜索 STYLE_MULTI_GRID ==="
          if grep -n "STYLE_MULTI_GRID" "$CONFIG_FILE"; then
            echo "✅ 源代码包含新增内容"
          else
            echo "❌ 警告：源代码中没有 STYLE_MULTI_GRID！"
            echo "该文件中的 STYLE 常量："
            grep -n "STYLE" "$CONFIG_FILE" | head -20
            exit 1
          fi

      - name: Ensure gradle.properties ends with newline
        run: |
          if [ -s gradle.properties ]; then
            if [ -n "$(tail -c 1 gradle.properties)" ]; then
              echo "" >> gradle.properties
            fi
          fi

      - name: Configure Gradle
        run: |
          echo "org.gradle.caching=false" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Make Gradlew executable
        run: chmod +x gradlew

      # ====== 构建 JAR（使用 makeDanmuJar）======
      - name: Build danmu.jar
        run: ./gradlew clean makeDanmuJar --no-daemon --console=plain

      # ====== 验证构建产物 ======
      - name: Verify danmu.jar
        run: |
          echo "=== 文件信息 ==="
          ls -la jar/danmu.jar
          echo ""
          echo "=== MD5 ==="
          md5sum jar/danmu.jar
          echo ""
          echo "=== 检查编译产物 ==="
          mkdir -p /tmp/check && cd /tmp/check
          jar xf "$GITHUB_WORKSPACE/jar/danmu.jar"
          CLASS_FILE=$(find . -name "DanmakuConfig.class" | head -1)
          if [ -n "$CLASS_FILE" ]; then
            echo "找到: $CLASS_FILE"
            if strings "$CLASS_FILE" | grep "多格模式"; then
              echo "✅ 编译产物包含多格模式"
            else
              echo "❌ 编译产物中没有多格模式！"
              echo "class 中的相关字符串："
              strings "$CLASS_FILE" | grep -i "模式\|STYLE" || true
            fi
          else
            echo "❌ JAR 中没有 DanmakuConfig.class"
            echo "JAR 内容："
            find . -type f | head -30
          fi

      - name: Upload danmu.jar
        uses: actions/upload-artifact@v4
        with:
          name: danmu-jar
          path: jar/danmu.jar
          retention-days: 30
          if-no-files-found: error

      # ====== 删除旧 release ======
      - name: Delete old release
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: 'latest'
              });
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id
              });
              console.log('旧 release 已删除');
            } catch (e) {
              console.log('没有旧 release');
            }
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/latest'
              });
              console.log('旧 tag 已删除');
            } catch (e) {
              console.log('没有旧 tag');
            }

      # ====== 创建新 release ======
      - name: Create release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: jar/danmu.jar
          tag_name: latest
          name: Latest Danmu Build
          body: Danmu.jar 自动构建版本
