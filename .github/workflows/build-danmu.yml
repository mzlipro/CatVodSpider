name: Build Danmu JAR
on:
 // push:
  //  branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure gradle.properties ends with newline
        run: |
          if [ -s gradle.properties ]; then
            # 如果文件末尾没有换行符，添加一个
            if [ -n "$(tail -c 1 gradle.properties)" ]; then
              echo "" >> gradle.properties
            fi
          fi

      - name: Configure Gradle
        run: |
          echo "org.gradle.caching=true" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Make Gradlew executable
        run: chmod +x gradlew

      - name: Build danmu.jar
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Verify danmu.jar
        run: ls -la jar/danmu.jar

      - name: Upload danmu.jar
        uses: actions/upload-artifact@v4
        with:
          name: danmu-jar
          path: jar/danmu.jar
          retention-days: 30
          if-no-files-found: error

      - name: Create release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: jar/danmu.jar
          tag_name: latest
          name: Latest Danmu Build
          body: Danmu.jar 自动构建版本
