name: Build Danmu JAR

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # ← 明确指定拉取 main 分支

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure gradle.properties ends with newline
        run: |
          if [ -s gradle.properties ]; then
            if [ -n "$(tail -c 1 gradle.properties)" ]; then
              echo "" >> gradle.properties
            fi
          fi

      - name: Configure Gradle
        run: |
          echo "org.gradle.caching=true" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Make Gradlew executable
        run: chmod +x gradlew

      - name: Print commit info
        run: |
          echo "Building from branch: $(git branch --show-current)"
          echo "Latest commit: $(git log -1 --oneline)"
          echo "Commit date: $(git log -1 --format='%ci')"
          grep -n "STYLE_MULTI_GRID" DanmakuConfig.java || echo "警告: 没找到 STYLE_MULTI_GRID，代码可能未更新！"

      - name: Build danmu.jar
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Verify danmu.jar
        run: ls -la jar/danmu.jar

      - name: Upload danmu.jar
        uses: actions/upload-artifact@v4
        with:
          name: danmu-jar
          path: jar/danmu.jar
          retention-days: 30
          if-no-files-found: error

      - name: Create release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: jar/danmu.jar
          tag_name: latest
          name: Latest Danmu Build
          body: Danmu.jar 自动构建版本
