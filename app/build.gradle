plugins {
    id 'com.android.application'
    id 'ru.cleverpumpkin.proguard-dictionaries-generator'
}

android {
    namespace 'com.github.catvod'

    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.github.catvod.demo"
        minSdk 21
        targetSdk 36
    }

    buildFeatures {
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false  // 临时禁用混淆
            shrinkResources false
            proguardFiles 'proguard-rules.pro'
            proguardDictionaries {
                dictionaryNames = ["build/class-dictionary", "build/package-dictionary", "build/obfuscation-dictionary"]
                minLineLength 1
                maxLineLength 3
                linesCountInDictionary 100000
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    configurations.configureEach {
        resolutionStrategy {
            force 'com.squareup.okhttp3:okhttp:' + okhttpVersion
        }
    }

    lint {
        baseline = file("lint-baseline.xml")
        abortOnError false
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:' + okhttpVersion
    implementation 'com.github.thegrizzlylabs:sardine-android:0.9'
    implementation 'wang.harlon.quickjs:wrapper-android:3.2.3'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.hierynomus:smbj:0.14.0'
    implementation 'com.orhanobut:logger:2.2.0'
    implementation 'org.jsoup:jsoup:1.21.2'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}

// ========== 构建 danmu.jar（打包 classes.dex）==========
task makeDanmuJar {
    dependsOn 'assembleRelease'

    doLast {
        // 1. 查找编译产出的 classes.dex
        def classesDex = null
        def searchRoot = file("${buildDir}/intermediates")
        searchRoot.eachFileRecurse { f ->
            if (f.name == 'classes.dex' && classesDex == null && f.absolutePath.contains('release')) {
                classesDex = f
            }
        }
        if (classesDex == null) {
            throw new GradleException('classes.dex not found in build intermediates')
        }
        println "Source DEX: ${classesDex.absolutePath} (${classesDex.length()} bytes)"

        // 2. 创建 JAR，将 classes.dex 放在根目录
        def jarFile = file("${project.rootDir}/jar/danmu.jar")
        jarFile.parentFile?.mkdirs()

        def zos = new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(jarFile))
        try {
            // META-INF/MANIFEST.MF
            zos.putNextEntry(new java.util.zip.ZipEntry('META-INF/MANIFEST.MF'))
            zos.write('Manifest-Version: 1.0\r\n\r\n'.getBytes('UTF-8'))
            zos.closeEntry()

            // classes.dex（放在 JAR 根目录）
            zos.putNextEntry(new java.util.zip.ZipEntry('classes.dex'))
            zos.write(classesDex.bytes)
            zos.closeEntry()
        } finally {
            zos.close()
        }

        println "danmu.jar created: ${jarFile.length()} bytes"
    }
}
