plugins {
    id 'com.android.application'
    id 'ru.cleverpumpkin.proguard-dictionaries-generator'
}

android {
    namespace 'com.github.catvod'

    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.github.catvod.demo"
        minSdk 21
        targetSdk 36
    }

    buildFeatures {
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false  // 临时禁用混淆
            shrinkResources false
            proguardFiles 'proguard-rules.pro'
            proguardDictionaries {
                dictionaryNames = ["build/class-dictionary", "build/package-dictionary", "build/obfuscation-dictionary"]
                minLineLength 1
                maxLineLength 3
                linesCountInDictionary 100000
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    configurations.configureEach {
        resolutionStrategy {
            force 'com.squareup.okhttp3:okhttp:' + okhttpVersion
        }
    }

    lint {
        baseline = file("lint-baseline.xml")
        abortOnError false
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:' + okhttpVersion
    implementation 'com.github.thegrizzlylabs:sardine-android:0.9'
    implementation 'wang.harlon.quickjs:wrapper-android:3.2.3'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.hierynomus:smbj:0.14.0'
    implementation 'com.orhanobut:logger:2.2.0'
    implementation 'org.jsoup:jsoup:1.21.2'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}

// ========== 构建 danmu.jar（只打包项目自己的类）==========
task makeDanmuJar {
    dependsOn 'compileReleaseJavaWithJavac'

    doLast {
        // 1. 查找项目编译后的 class 文件（只取 com/github/catvod/ 包）
        def classesDir = file("${buildDir}/intermediates/javac/release/classes")
        if (!classesDir.exists()) {
            // 兼容不同 AGP 版本的输出路径
            def found = false
            fileTree(dir: "${buildDir}/intermediates/javac").visit { d ->
                if (!found && d.file.isDirectory() && d.file.name == 'classes') {
                    classesDir = d.file
                    found = true
                }
            }
        }
        def classFiles = []
        fileTree(dir: classesDir).visit { details ->
            if (!details.isDirectory() && details.file.name.endsWith('.class')) {
                def path = details.relativePath.pathString
                if (path.startsWith('com/github/catvod/js/')
        || path.startsWith('com/github/catvod/net/')
        || path.startsWith('com/github/catvod/spider/')) {
                    classFiles.add(details.file)
                }
            }
        }
        if (classFiles.isEmpty()) {
            throw new GradleException('未找到项目编译的 class 文件')
        }
        println "项目 class 文件数: ${classFiles.size()}"

        // 2. 查找 Android SDK 的 d8 工具和 android.jar
        def sdkDir = android.sdkDirectory
        def buildToolsDir = new File(sdkDir, 'build-tools')
        def btVersions = buildToolsDir.listFiles()
        if (btVersions == null || btVersions.length == 0) {
            throw new GradleException('未找到 Android build-tools')
        }
        def btDir = btVersions.sort { it.name }.last()
        def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
        def d8 = new File(btDir, isWindows ? 'd8.bat' : 'd8')

        def platformsDir = new File(sdkDir, 'platforms')
        def platformDirs = platformsDir.listFiles()
        if (platformDirs == null || platformDirs.length == 0) {
            throw new GradleException('未找到 Android platforms')
        }
        def platformDir = platformDirs.sort { it.name }.last()
        def androidJar = new File(platformDir, 'android.jar')

        println "d8: ${d8.absolutePath}"
        println "android.jar: ${androidJar.absolutePath}"

        // 3. 运行 d8 将项目 class 转换为 dex（依赖库不打入，仅作为 --lib 引用）
        def tmpDir = file("${buildDir}/tmp/danmu-dex")
        tmpDir.deleteDir()
        tmpDir.mkdirs()

        def cmd = [d8.absolutePath, '--release', '--output', tmpDir.absolutePath, '--lib', androidJar.absolutePath]
        classFiles.each { cmd.add(it.absolutePath) }

        def process = new ProcessBuilder(cmd)
                .directory(project.rootDir)
                .redirectErrorStream(true)
                .start()
        def output = process.inputStream.text
        process.waitFor()
        if (process.exitValue() != 0) {
            throw new GradleException("d8 执行失败:\n${output}")
        }
        if (output?.trim()) println "d8 输出: ${output}"

        def dexFile = new File(tmpDir, 'classes.dex')
        if (!dexFile.exists()) {
            throw new GradleException('d8 未生成 classes.dex')
        }
        println "DEX 大小: ${dexFile.length()} bytes"

        // 4. 打包为 JAR（classes.dex 放在根目录，与旧格式一致）
        def jarFile = file("${project.rootDir}/jar/danmu.jar")
        jarFile.parentFile?.mkdirs()

        def zos = new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(jarFile))
        try {
            zos.putNextEntry(new java.util.zip.ZipEntry('META-INF/MANIFEST.MF'))
            zos.write('Manifest-Version: 1.0\r\n\r\n'.getBytes('UTF-8'))
            zos.closeEntry()
            zos.putNextEntry(new java.util.zip.ZipEntry('classes.dex'))
            zos.write(dexFile.bytes)
            zos.closeEntry()
        } finally {
            zos.close()
        }

        println "danmu.jar 已生成: ${jarFile.length()} bytes"
    }
}
